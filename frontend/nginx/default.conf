limit_req_zone $binary_remote_addr zone=one:10m rate=20r/s;

server {
    listen 80;
    server_name judjang.online;

    # -----------------------
    # Security headers
    # -----------------------
   

    client_header_timeout 300s;
    client_body_timeout 300s;
    send_timeout 300s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # -----------------------
    # GZIP
    # -----------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        application/javascript 
        application/json 
        application/xml 
        image/svg+xml;

    client_max_body_size 100M;

    # -----------------------
    # Next.js (Frontend)
    # -----------------------
    location / {
        proxy_pass http://187.127.117.38:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;
    }

    # -----------------------
    # API Backend
    # -----------------------
    location /api/ {

        valid_referers none blocked server *.judjang.online judjang.online;
    
        if ($invalid_referer) {
            return 403;
        }
        limit_req zone=one burst=20 nodelay;
        proxy_pass http://187.127.117.38:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        
        
        limit_except GET POST PUT DELETE PATCH {
            deny all;
        }
    }

    location /auth/ {
        limit_req zone=one burst=20 nodelay;
        proxy_pass http://187.127.117.38:8000;
        proxy_http_version 1.1;

        limit_except GET POST PUT DELETE PATCH {
            deny all;
        }
    }

    # -----------------------
    # Badminton Service
    # -----------------------
    # -----------------------
    # MinIO Service (Badminton Storage)
    # -----------------------
    


    



    # -----------------------
    # Next.js static optimization
    # -----------------------
    location /_next/static/ {
        proxy_pass http://187.127.117.38:3000/_next/static/;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # -----------------------
    # Error pages
    # -----------------------
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}